group = "com.globitel.volai.flutter"
version = "0.1.0"

buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath "com.android.tools.build:gradle:8.7.3"
    }
}

rootProject.allprojects {
    repositories { google(); mavenCentral() }
}

// Kotlin is applied by the Flutter Gradle plugin (built-in Kotlin on AGP 9,
// kotlin-android before that), so this file declares neither.
apply plugin: "com.android.library"

android {
    namespace = "com.globitel.volai.flutter"
    compileSdk = 35
    defaultConfig { minSdk = 24 }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    sourceSets { main { java.srcDirs += "src/main/kotlin" } }
}

// Keep Kotlin on the same JVM target as compileOptions whichever way Flutter
// provides Kotlin (its applied kotlin-android plugin, or AGP's built-in Kotlin).
afterEvaluate {
    if (android.hasProperty("kotlinOptions")) android.kotlinOptions.jvmTarget = "17"
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
