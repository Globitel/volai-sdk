openapi: 3.1.0
info:
  title: Volai Mobile SDK API
  version: "1.0"
  description: |
    Contract for the Volai client SDKs (iOS, Android, React Native, Flutter, web).
    Base path: `https://<host>/gicc/api/sdk/v1`. Every response carries
    `X-Volai-Contract: 1`. Breaking changes ship as `/sdk/v2`.

    Credentials:
    * **App key** (`type: sdk`) — publishable, shipped inside the app. Sent as
      `Authorization: Bearer <key>` on agent lookup, session creation and verification.
    * **Secret key** (`type: sdk_secret`) — server-side only. Mints session grants.
    * **Chat token** — returned by session creation for chat; sent as
      `Authorization: Bearer <chat_token>` (or `chat_token` query/body) on chat calls.
    * **Socket token** — returned by session creation for voice; single use, 5 minutes.

    Voice: two transports. `ws_audio` (default for SDK sessions) is one
    WebSocket carrying JSON control frames and raw PCM frames, no WebRTC on
    the client. `webrtc` (mediasoup signalling over `wss://<host>/gicc/ws/client`)
    remains for legacy clients. Read `voiceTransports` from the agent lookup and `transport` from
    the session response rather than assume. Details: voice-ws-protocol.md.

    Video: contract 1 carries no video on the ws_audio socket. Live-agent video
    is a WebRTC feature; web clients add a video-only WebRTC leg (see
    voice-ws-protocol.md, "Video with a live agent"), native SDKs should not
    implement video in contract 1.
servers:
  - url: https://{host}/gicc/api/sdk/v1
    variables:
      host:
        default: gicc.globitel.com
tags:
  - name: Discovery
  - name: Sessions
  - name: Chat
  - name: Verification
  - name: Grants
paths:
  /health:
    get:
      tags: [Discovery]
      summary: Reachability and contract version
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  contract: { type: integer, example: 1 }
                  voice_transports:
                    type: array
                    items: { type: string, enum: [webrtc, ws_audio] }
  /agents/{agentId}:
    get:
      tags: [Discovery]
      summary: Public agent information
      description: The agent must be public, belong to the key's tenant and sit inside the key's agent scope.
      security: [{ appKey: [] }]
      parameters:
        - $ref: "#/components/parameters/agentId"
      responses:
        "200":
          description: Agent info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /agents/{agentId}/verification/send:
    post:
      tags: [Verification]
      summary: Send a one-time code to a phone or email
      description: Only for agents whose widget settings require verification. Rate limited per IP and per destination.
      security: [{ appKey: [] }]
      parameters:
        - $ref: "#/components/parameters/agentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, destination]
              properties:
                channel: { type: string, enum: [phone, email] }
                destination: { type: string, example: "+962791234567" }
                language: { type: string, example: ar }
      responses:
        "200": { description: Code sent }
        "429": { $ref: "#/components/responses/RateLimited" }
  /agents/{agentId}/verification/check:
    post:
      tags: [Verification]
      summary: Check a one-time code and receive a verification token
      security: [{ appKey: [] }]
      parameters:
        - $ref: "#/components/parameters/agentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, destination, code]
              properties:
                channel: { type: string, enum: [phone, email] }
                destination: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Verified. Pass the token in `verification_tokens` when creating a session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verification_token: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { description: Wrong or expired code }
  /sessions:
    post:
      tags: [Sessions]
      summary: Create a voice or chat session
      security: [{ appKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VoiceSession"
                  - $ref: "#/components/schemas/ChatSession"
        "400": { description: Invalid request, unsupported transport, or invalid phone/email }
        "401": { description: Invalid key, invalid or replayed grant, or wrong public link password }
        "402": { description: Credit bundle exhausted }
        "403":
          description: Verification required (`reason: verification_required`) or agent outside the key's scope
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: Tenant voice concurrency limit, guardrail cooldown, or key rate limit
        "504": { description: The session service did not respond in time }
  /sessions/{sessionId}/messages:
    post:
      tags: [Chat]
      summary: Send a user message
      security: [{ chatToken: [] }]
      parameters: [{ $ref: "#/components/parameters/sessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id]
              properties:
                message_id: { type: string, format: uuid }
                content: { type: string, description: "The customer's text. Required unless `interaction_reply` is sent." }
                interaction_reply:
                  type: object
                  description: |
                    A tap on an interactive message (see the `interactive` event). The server
                    writes the chosen options' titles as the customer's message, so `content`
                    can be omitted. The first answer locks the question (`interactive_answered`
                    follows); a later tap on the same question is treated as an ordinary
                    message with that title.
                  required: [interactive_id, option_ids]
                  properties:
                    interactive_id: { type: string, format: uuid }
                    option_ids: { type: array, items: { type: string }, minItems: 1, description: "For a message of kind `choices`." }
                    values:
                      type: object
                      description: "For a message of kind `form`: the customer's answers by field key. The server checks them; a refused submit answers 422 with `reason: invalid_form` and `errors` by field key, and the form stays open."
                    cancelled: { type: boolean, description: "For a message of kind `form`: the customer closed it without sending." }
                attachment:
                  allOf: [{ $ref: "#/components/schemas/ChatAttachment" }]
                  nullable: true
                  description: The `attachment` object returned by the attachments endpoint, unchanged. Only meaningful while a human agent owns the chat; the AI does not read files.
      responses:
        "200": { description: Accepted; the reply arrives on the events stream (NDJSON may also be streamed in this response) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "`reason: interactive_not_found`: an `interaction_reply` without `content` named a question that is not part of this session. `reason: interactive_closed`: the form was already sent, cancelled or replaced" }
        "422": { description: "`reason: invalid_form`: a form's values were refused; `errors` holds one message per field key" }
        "429": { description: Session message cap or tenant monthly chat quota reached }
  /sessions/{sessionId}/attachments:
    post:
      tags: [Chat]
      summary: Upload a file to send in this chat
      description: |
        `multipart/form-data` with one `file` part, accepted at any point of the
        conversation. With a human agent on the chat (after `LIVE_AGENT_CONNECTED`,
        until `LIVE_AGENT_DISCONNECTED`) the file reaches the agent. While the AI owns
        the chat it does not read the file: the AI agent's Attachments setting decides
        whether the platform sends an automatic reply and optionally transfers the chat
        to a human agent, or whether the model is told a file arrived and answers on its
        own. Servers older than 1.3.104 refuse the upload before a transfer with 409 and
        `reason: attachments_unavailable`. Send the returned `attachment` object
        unchanged in the next `messages` call, with a caption such as
        `Sent a file: <name>`. Files the human agent sends arrive as
        `human_chat` (or `chat`) events carrying the same `attachment` object; its `url`
        is relative to the Volai origin. One file of up to 10 MB: JPEG, PNG, GIF, WebP,
        WAV, MP3, M4A, MP4, WebM, OGG, PDF, DOC/DOCX, XLS/XLSX, TXT, CSV. 20 uploads
        per session per minute.
      security: [{ chatToken: [] }]
      parameters: [{ $ref: "#/components/parameters/sessionId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment: { $ref: "#/components/schemas/ChatAttachment" }
                  download_url: { type: string, description: Absolute URL of the file }
                  max_bytes: { type: integer, description: Server cap on one file }
        "400": { description: No file, or a file type outside the allowlist }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "Servers older than 1.3.104 only: no human agent on the conversation (`reason: attachments_unavailable`)" }
        "413": { description: File larger than `max_bytes` }
        "429": { $ref: "#/components/responses/RateLimited" }
  /sessions/{sessionId}/acks:
    post:
      tags: [Chat]
      summary: Acknowledge delivery or read of an agent message
      security: [{ chatToken: [] }]
      parameters: [{ $ref: "#/components/parameters/sessionId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [message_id, status]
              properties:
                message_id: { type: string }
                status: { type: string, enum: [delivered, read] }
      responses:
        "200": { description: OK }
  /sessions/{sessionId}/typing:
    post:
      tags: [Chat]
      summary: Typing indicator from the user
      security: [{ chatToken: [] }]
      parameters: [{ $ref: "#/components/parameters/sessionId" }]
      responses:
        "200": { description: OK }
  /sessions/{sessionId}/events:
    get:
      tags: [Chat]
      summary: Server-sent events for a chat session
      description: |
        `text/event-stream`. Pass `chat_token` as a query parameter (EventSource
        cannot set headers) and `cursor` to resume after a disconnect. Event types:
        `ack`, `chunk`, `chat`, `chat_complete`, `human_chat`, `typing`, `system`,
        `LIVE_AGENT_CONNECTED`, `LIVE_AGENT_DISCONNECTED`, `handoff`, `context_update`,
        `SESSION_ENDED`, `error`. A `human_chat` or `chat` event may carry an
        `attachment` object (see `ChatAttachment`) when the human agent sent a file.
        A client must display `human_chat` (a live agent's message) and `system`
        (queue and hand-off status) as well as `chat` and `chunk` (the AI's reply),
        or the conversation goes silent for the customer after a hand-off.

        A session created with `capabilities: ["interactive"]` also receives
        `interactive` and `interactive_answered`. `interactive` carries a question with
        options for the app to draw: `{ id, role: "agent", content, interactive }`, where
        `interactive` is an `InteractiveMessage` and `content` is the same question as
        numbered text. It follows the turn's text; a turn that is only a question has a
        `chat_complete` with empty `content` and no `id`. Answer it with
        `interaction_reply` on the messages endpoint. `interactive_answered`
        (`{ id, option_ids, source }`, `source` is `native` for a tap and `text` when the
        customer typed the option's number or title) follows the first answer: lock the
        options and mark the chosen ones. A session created without the capability
        receives the question as numbered text inside the normal reply and none of this.

        A session created with `capabilities: ["interactive", "forms"]` also receives
        forms: an `interactive` event whose `interactive` has `kind: "form"`, a `form`
        (title, submit label, fields in the conversation language) and a `prefill` of
        values the agent already knew. Draw the fields, send the answers as
        `interaction_reply.values`, or `interaction_reply.cancelled: true`. For a form,
        `interactive_answered` carries `outcome` (`submitted`, `cancelled`) and the
        accepted `values`, with sensitive ones replaced by `***`. Without `forms` the
        customer is asked the form one question per message as ordinary text.

        With `client_actions` among the session's `capabilities`, a guided flow may
        send `client_action`: `{ id, action, params, token, content }`. The app carries
        out the named action in its own screens (a login, a payment) and hands `token`
        to its backend, which reports the result with the secret key
        (`POST /client-actions/complete`). The app itself may only report that the
        action was cancelled or failed (`POST /sessions/{sessionId}/client-actions/{actionId}`).
        The flow's next message arrives on this stream. `client_action` is not replayed
        after a reconnect. Without the capability the customer reads `content`, followed
        by a link when the flow has one.
      security: [{ chatTokenQuery: [] }]
      parameters:
        - $ref: "#/components/parameters/sessionId"
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200": { description: Event stream }
  /sessions/{sessionId}/status:
    get:
      tags: [Chat]
      summary: Chat session status
      security: [{ chatToken: [] }]
      parameters: [{ $ref: "#/components/parameters/sessionId" }]
      responses:
        "200": { description: Status }
  /sessions/{sessionId}/close:
    post:
      tags: [Sessions]
      summary: Close a chat session
      description: Voice sessions end with `session.end` on the socket (ws_audio) or by closing the socket.
      security: [{ chatToken: [] }]
      parameters: [{ $ref: "#/components/parameters/sessionId" }]
      responses:
        "200": { description: Closed }
  /sessions/{sessionId}/client-actions/{actionId}:
    post:
      tags: [Chat]
      summary: Report that a client action was cancelled or failed
      description: |
        The app's own word about a `client_action` it received. It cannot report
        success: any outcome other than `cancelled` is recorded as `failed`. A
        finished action is reported by the customer's backend.
      security: [{ chatToken: [] }]
      parameters:
        - $ref: "#/components/parameters/sessionId"
        - in: path
          name: actionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [cancelled, failed] }
      responses:
        "200": { description: Recorded; the flow carries on }
        "409": { description: The action is no longer waiting for a result }
  /client-actions/complete:
    post:
      tags: [Grants]
      summary: Report the result of a client action (server to server)
      description: |
        Called by the customer's backend with the **secret** key, with the `token`
        the app received in `client_action` (or the `volai_action` query parameter
        of the flow's link). `data` may carry values the flow declared; anything
        else is ignored. The token is valid for 30 minutes and for one result.
        Never send card numbers or passwords.
      security: [{ secretKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, outcome]
              properties:
                token: { type: string }
                outcome: { type: string, enum: [done, cancelled, failed] }
                data:
                  type: object
                  additionalProperties: { oneOf: [{ type: string }, { type: number }, { type: boolean }] }
      responses:
        "200": { description: Recorded; the flow carries on }
        "400": { description: The token is not valid or has expired, or the outcome is not one of the three }
        "409": { description: The action is no longer waiting for a result }
  /session-grants:
    post:
      tags: [Grants]
      summary: Mint a session grant (server to server)
      description: |
        Called by the customer's backend with the **secret** key. The returned grant
        is passed by the app in `session_grant` when creating a session. It is
        single use and expires after `ttl_seconds` (default 300, max 900). A grant
        makes the session's caller identity trusted: the phone it carries counts
        as verified and `external_user_id` is placed in the session context.
      security: [{ secretKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                external_user_id: { type: string, maxLength: 128 }
                caller_phone: { type: string, description: "Kept as sent, minus spaces and punctuation: 7 to 15 digits with an optional + or 00 prefix (00 becomes +). National numbers are not given a country code.", example: "+962791234567" }
                caller_name: { type: string, maxLength: 120 }
                caller_email: { type: string, format: email }
                agent_id: { type: string, description: "Optional. Restrict the grant to one public agent id." }
                context:
                  type: object
                  description: Up to 32 scalar values, keys alphanumeric or underscore
                  additionalProperties: { type: [string, number, boolean] }
                ttl_seconds: { type: integer, minimum: 30, maximum: 900, default: 300 }
              anyOf:
                - required: [external_user_id]
                - required: [caller_phone]
      responses:
        "201":
          description: Grant issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_grant: { type: string }
                  expires_at: { type: string, format: date-time }
                  ttl_seconds: { type: integer }
                  contract: { type: integer }
        "400": { description: Invalid field }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    appKey: { type: http, scheme: bearer, description: Publishable `sdk` key }
    secretKey: { type: http, scheme: bearer, description: Server-side `sdk_secret` key }
    chatToken: { type: http, scheme: bearer, description: chat_token from session creation }
    chatTokenQuery: { type: apiKey, in: query, name: chat_token }
  parameters:
    agentId:
      in: path
      name: agentId
      required: true
      schema: { type: string, description: "32-character public agent id" }
    sessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Missing or invalid credential
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Agent or session not found, or not available to this app
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests; honour `Retry-After`
  schemas:
    ChatAttachment:
      type: object
      description: A file attached to a chat message, as stored in the conversation. `url` is relative to the Volai origin.
      required: [url, filename, mimetype, size]
      properties:
        url: { type: string, example: /gicc/uploads/chat/chat-1762271234567-123456789.pdf }
        filename: { type: string }
        mimetype: { type: string }
        size: { type: integer }
    Error:
      type: object
      properties:
        message: { type: string }
        code: { type: string }
        reason: { type: string }
    PublicAgent:
      type: object
      properties:
        api_id: { type: string }
        name: { type: string }
        description: { type: string }
        type: { type: string }
        embedMode: { type: string, enum: [chat, voice, both] }
        voiceTransports:
          type: array
          items: { type: string, enum: [webrtc, ws_audio] }
        defaultVoiceTransport: { type: string }
        publicLinkPasswordRequired: { type: boolean }
        widgetContactFields:
          type: object
          properties:
            askPhone: { type: boolean }
            askName: { type: boolean }
            askEmail: { type: boolean }
            verifyPhone: { type: boolean }
            verifyEmail: { type: boolean }
        widgetLanguage: { type: string }
        widgetDefaultCountry: { type: string }
        logoUrl: { type: string }
        branding: { type: object }
    CreateSessionRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id: { type: string, description: "32-character public agent id" }
        type: { type: string, enum: [voice, chat], default: chat }
        transport: { type: string, enum: [ws_audio, webrtc], description: "Voice only. Omit to let the server pick (ws_audio for SDK sessions)." }
        device_id: { type: string, maxLength: 120, description: "Stable per-install id; used for quota keying when no grant is present" }
        caller_name: { type: string }
        caller_phone: { type: string, description: "Kept as sent, minus spaces and punctuation: 7 to 15 digits with an optional + or 00 prefix (00 becomes +). National numbers are not given a country code. Ignored when a grant is present." }
        caller_email: { type: string }
        context:
          type: object
          description: Initial context variables visible to the agent
        verification_tokens:
          type: object
          properties:
            phone: { type: string }
            email: { type: string }
        session_grant: { type: string, description: "From POST /session-grants" }
        public_link_password: { type: string }
        language:
          type: string
          example: ar
          description: "The language of the app's own screens, as a short tag (`ar`, `en`, `ar-kw`). When it is one of the agent's languages, the conversation starts and stays in it: the greeting, the agent's replies and translated forms. A language the agent does not allow, or a malformed value, is ignored and the agent's own language setting applies. The customer can still ask the agent to switch. Texts of guided flows are in the language they were written in."
        capabilities:
          type: array
          items: { type: string, enum: [interactive, forms, cards, client_actions] }
          description: "Chat only. What the app draws itself. `interactive`: questions with options arrive as `interactive` events instead of numbered text. `forms`: forms arrive as `interactive` events of kind `form` instead of one question per message. `cards`: cards arrive as `interactive` events of kind `card`; without it a card arrives as a question with options (with `interactive`) or as text. `client_actions`: a guided flow may send a `client_action` event for a step the app carries out itself; without it the customer reads the step's text and link. Unknown values are ignored."
    InteractiveCard:
      type: object
      description: |
        Structured information for the app to draw (`interactive` event, `kind` `card`). It asks for nothing.
        `fields` are generic and always usable. `template` and `data`, when present, name the app's own card
        and carry its raw values, passed through from the agent untouched: draw your own card from them and
        fall back to `fields` for a template you do not know. An action is answered with
        `interaction_reply.option_ids: [action id]`; `interactive_answered` follows.
      required: [id, kind, text, fields, actions]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [card] }
        text: { type: string, description: The card's title }
        body: { type: string }
        image:
          type: object
          properties: { url: { type: string, format: uri } }
        fields:
          type: array
          maxItems: 12
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
              progress: { type: number, minimum: 0, maximum: 1, description: Draw as a bar }
        actions:
          type: array
          maxItems: 4
          items:
            type: object
            required: [id, title]
            properties: { id: { type: string }, title: { type: string } }
        template: { type: string, description: "Lowercase name of the app's own card, as the tenant told the agent" }
        data: { type: object, description: Raw values for the template, at most 4 KB of JSON }
    InteractiveForm:
      type: object
      description: A form for the app to draw (`interactive` event, `kind` `form`). Labels are already in the conversation language.
      required: [id, kind, text, form]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [form] }
        text: { type: string, description: The form's title }
        form_key: { type: string }
        language: { type: string, example: ar }
        prefill: { type: object, description: "Values by field key that the agent already knew; show them filled in and editable" }
        form:
          type: object
          required: [title, submit_label, fields]
          properties:
            title: { type: string }
            submit_label: { type: string }
            intro: { type: string }
            fields:
              type: array
              maxItems: 20
              items:
                type: object
                required: [key, label, type]
                properties:
                  key: { type: string }
                  label: { type: string }
                  type: { type: string, enum: [text, textarea, number, select, multiselect, date, checkbox, rating, scale, tags], description: "`date` values are YYYY-MM-DD; `rating` is 1 to 5, `scale` 0 to 10; `multiselect` and `tags` are arrays of option values; `checkbox` is a boolean" }
                  required: { type: boolean }
                  options: { type: array, items: { type: object, properties: { value: { type: string }, label: { type: string } } } }
                  max_length: { type: integer }
                  pattern: { type: string, description: Regular expression the whole value must match (text only) }
                  pattern_hint: { type: string }
                  help: { type: string }
                  sensitive: { type: boolean, description: "Mask the input; the value comes back as `***`" }
                  visible_when:
                    type: object
                    description: "Show the field only when the named earlier field has this value; a hidden field is not sent"
                    properties: { field: { type: string }, equals: {} }
    InteractiveMessage:
      type: object
      description: A question with options, in one shape for every channel. The app draws it; the SDK has no user interface.
      required: [id, kind, text, layout, options]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [choices] }
        text: { type: string, description: The question, up to 1000 characters }
        layout: { type: string, enum: [buttons, list, cards], description: "A hint. `buttons`: up to three short options. `list`: more options, longer titles or second lines. `cards`: options with pictures." }
        multi: { type: boolean, description: Always false in this release (one option per answer) }
        button_label: { type: string, description: "Label for a control that opens the options, in the conversation language" }
        image:
          type: object
          properties: { url: { type: string, format: uri } }
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            type: object
            required: [id, title]
            properties:
              id: { type: string }
              title: { type: string, maxLength: 60 }
              description: { type: string, maxLength: 72 }
              image:
                type: object
                properties: { url: { type: string, format: uri, description: Absolute https URL } }
    VoiceSession:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        type: { type: string, enum: [voice] }
        transport: { type: string, enum: [ws_audio, webrtc] }
        ws_url: { type: string, description: "Socket URL with the token already attached (ws_audio: /gicc/ws/sdk/voice, webrtc: /gicc/ws/client)" }
        ws_token: { type: string }
        ws_token_expires_in: { type: integer, example: 300 }
        contract: { type: integer }
    ChatSession:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        type: { type: string, enum: [chat] }
        chat_token: { type: string }
        events_url: { type: string }
        initial_greeting:
          type: object
          nullable: true
          properties:
            id: { type: string }
            content: { type: string }
        idle_minutes: { type: integer, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        contract: { type: integer }
