name: Release

# Tagging vX.Y.Z publishes a GitHub Release with the built artefacts. Swift
# Package Manager, React Native (git) and Flutter (git) consumers resolve the
# tag directly; Android apps take the AAR from the release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write   # npm trusted publishing and pub.dev automated publishing (OIDC)

jobs:
  build:
    name: Build artefacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4

      - name: Web client
        working-directory: web
        run: |
          npm ci && npm run build
          tar -czf ../volai-web-sdk-${GITHUB_REF_NAME}.tgz -C dist .

      - name: Android library
        working-directory: android
        run: |
          ./gradlew --no-daemon :volai-sdk:testDebugUnitTest :volai-sdk:assembleRelease
          cp volai-sdk/build/outputs/aar/volai-sdk-release.aar ../volai-android-sdk-${GITHUB_REF_NAME}.aar

      - name: React Native package
        working-directory: react-native
        run: |
          npm ci && npm run build
          npm pack --pack-destination ..
          mv ../volai-react-native-sdk-*.tgz ../volai-react-native-sdk-${GITHUB_REF_NAME}.tgz

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            volai-web-sdk-${{ github.ref_name }}.tgz
            volai-android-sdk-${{ github.ref_name }}.aar
            volai-react-native-sdk-${{ github.ref_name }}.tgz

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-24.04
    # Trusted publishing: the npm packages list this repository and this
    # workflow file as their trusted publisher, so no token is stored.
    # Requires npm CLI 11.5.1+ (setup-node ships an older npm).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - run: npm install -g npm@latest && npm --version
      - name: '@volai/web-sdk'
        working-directory: web
        run: npm ci && npm publish --access public
      - name: '@volai/react-native-sdk'
        working-directory: react-native
        run: npm ci && npm publish --access public

  publish-pub:
    name: Publish to pub.dev
    needs: build
    # pub's own reusable workflow: setup-dart provisions the OIDC token for
    # pub.dev, which lists this repository, the tag pattern v{{version}} and
    # the "pub.dev" GitHub environment as its automated publisher.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: flutter/volai_sdk
      environment: pub.dev

  publish-maven:
    name: Publish to Maven Central
    needs: build
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: android } }
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      # Signs with the in-memory key, uploads to the Central Portal and
      # releases automatically once validation passes.
      - run: ./gradlew --no-daemon --no-configuration-cache :volai-sdk:publishToMavenCentral
